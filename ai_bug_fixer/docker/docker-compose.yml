version: "3.9"

services:
  api:
    build:
      context: ../backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - redis
    volumes:
      - ../backend:/app

  worker:
    build:
      context: ../backend
    command: celery -A services.execution_service.celery_app worker --loglevel=info
    env_file:
      - ../.env
    depends_on:
      - redis
    volumes:
      - ../backend:/app

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
